name: axoview

services:
  app:
    build:
      context: .
      # The build context has no .git, so the release version for the About
      # tab comes in as a build arg (ADR 0045): set AXOVIEW_VERSION in the
      # shell or .env before building. Unset, it's empty and the build falls
      # back to package.json's version.
      args:
        AXOVIEW_VERSION: ${AXOVIEW_VERSION:-}
    ports:
      - 80:80
    environment:
      - NODE_ENV=production
      - ENABLE_SERVER_STORAGE=${ENABLE_SERVER_STORAGE:-true}
      - STORAGE_PATH=/data/diagrams
      - ENABLE_GIT_BACKUP=${ENABLE_GIT_BACKUP:-false}
    volumes:
      - ./diagrams:/data/diagrams
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
