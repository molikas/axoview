# Docker smoke — the `Docker Gate` check (ADR 0048 §1-§2; tactical
# docs/tactical/docker-regression-gate.md A5).
#
# Builds the image from the PR head exactly as `docker build .` does (the version
# build argument is the only one allowed) and runs the smoke against the running
# container through scripts/e2e-docker.js — the same runner a developer runs
# locally with `npm run test:e2e:docker`:
#   - storage ON with a volume, nginx on a remapped host port (8081);
#   - the browser write journey from a secure origin (localhost) and from an
#     insecure one (axoview.test via Chromium's host-resolver rule);
#   - the Origin-gate table with explicit Origin headers;
#   - a storage-OFF boot probe (/api/config 200, container healthy).
#
# No `paths:` filter, deliberately: a path-filtered required check either never
# reports (and blocks) or reports skipped (and passes). See ADR 0048 §1.
#
# `gate-proof/**` pushes exist for A6 (prove the gate can fail): `gh workflow run`
# only works for workflows already on the default branch, so the proof runs by
# pushing reverts to a gate-proof branch instead of opening a PR.

name: Docker smoke

on:
  pull_request:
    branches: ["master"]
    # `ready_for_review` is NOT in the default type set. Without it the draft
    # filter below becomes a hole once Docker Gate is required: draft → job
    # skipped → mark ready → nothing re-triggers → the check stays `skipped`.
    # (Same reasoning as e2e-playwright.yml.)
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["master", "gate-proof/**"]
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN: checkout + build + run the smoke only. The buildx
# GitHub Actions cache authenticates with the runner's own cache token, not this.
permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker smoke
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Full history + tags: scripts/resolve-version.js derives the version from
      # the nearest tag, and .dockerignore keeps .git out of the build context.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binaries keyed on the installed Playwright
      # version, so only the very first run per version pays the download.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` still apt-installs the OS libs on a cache hit (cheap); the
      # browser binary itself is skipped when already cached.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve AXOVIEW_VERSION
        id: version
        run: echo "version=$(node -p "require('./scripts/resolve-version')(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (docker build .)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: axoview:ci
          build-args: |
            AXOVIEW_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner owns run → wait → Playwright → teardown → leak audit, and
      # never removes an image it was given with --image.
      - name: Run the Docker smoke
        run: node scripts/e2e-docker.js --image=axoview:ci --run-id=ci
        env:
          CI: true

      - name: Upload smoke output (report + container logs)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-output
          path: test-results/docker-ci
          if-no-files-found: ignore
          retention-days: 7

  # Single stable check name, the same aggregator pattern as `E2E Gate`
  # (e2e-playwright.yml) and `CI Gate` (test.yml). Required once A6 has proven
  # the smoke can go red (ADR 0048 §1).
  docker-gate:
    name: Docker Gate
    # See the CI Gate note in test.yml: without `always()` a failed shard skips
    # this job, and a skipped check counts as a PASS for required checks.
    # Deliberately fail-closed on `skipped` too (draft PRs): "the suite did not
    # run" is not "the suite passed". Drafts can't be merged, and marking one
    # ready re-triggers the workflow via the `ready_for_review` type above.
    if: always()
    needs: [docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert the smoke passed
        run: |
          echo "docker-smoke result: ${{ needs.docker-smoke.result }}"
          if [ "${{ needs.docker-smoke.result }}" != "success" ]; then
            echo "::error::Docker Gate: the smoke did not pass (result=${{ needs.docker-smoke.result }})"
            exit 1
          fi
