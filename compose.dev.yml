name: axoview

services:
  app:
    build:
      context: .
      # The build context has no .git, so the release version for the About
      # tab comes in as a build arg (ADR 0045): set AXOVIEW_VERSION in the
      # shell or .env before building. Unset, it's empty and the build falls
      # back to package.json's version.
      args:
        AXOVIEW_VERSION: ${AXOVIEW_VERSION:-}
    ports:
      # 8080, never 3000: the backend's default ALLOWED_ORIGINS is
      # http://localhost:3000, so on 3000 the Origin gate always passes and
      # hides the 403 a real deployment would get (ADR 0048 §2).
      - "8080:80"
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ENABLE_SERVER_STORAGE=true
      - STORAGE_PATH=/data/diagrams
      - ENABLE_GIT_BACKUP=false
      - HTTP_AUTH_USER=${HTTP_AUTH_USER:-}
      - HTTP_AUTH_PASSWORD=${HTTP_AUTH_PASSWORD:-}
    volumes:
      - ./diagrams:/data/diagrams
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
